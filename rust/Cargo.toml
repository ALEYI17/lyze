[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot-bevy = "0.12.0"
bevy = { version = "0.19", default-features = false, features = ["bevy_state", "bevy_asset", "bevy_log"]}
godot = "0.5"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Safety / panic prevention
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Common in Bevy ECS APIs
type_complexity = "allow"
